[project]
name = "audience-radar"
version = "0.1.0"
description = "Audience Radar MVP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "sqlite-vec>=0.1.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
radar = "audience_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
